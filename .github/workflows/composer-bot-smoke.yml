# TEMPORARY — deleted before merge. Answers one question the audit could not:
# does GET /installation/repositories include archived repositories? Eleven of
# the 71 mirrors are archived, so if it omits them the new coverage check would
# hard-fail every 3h build.
name: Composer bot smoke test
on:
  push:
    branches:
      - chore/composer-bot-token
jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        id: app-token
        with:
          client-id: Iv23liSq2pR9zC6lUtCH
          private-key: ${{ secrets.COMPOSER_BOT_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}

      - name: Run the coverage check verbatim
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          set -euo pipefail

          gh api installation/repositories --paginate \
            --jq '.repositories[].full_name' | sort -u > /tmp/installed.txt

          jq -r '.repositories[] | select(.type=="vcs") | .url' satis.json \
            | sed -E 's#https://github.com/##; s#\.git$##' | sort -u > /tmp/wanted.txt

          echo "installed: $(wc -l < /tmp/installed.txt)  wanted: $(wc -l < /tmp/wanted.txt)"

          echo "--- archived mirrors, are they in the installation list? ---"
          for r in generoi/woocommerce-subscriptions generoi/wc-smartship generoi/woocommerce-gateway-verifone; do
            if grep -qxF "$r" /tmp/installed.txt; then echo "  present: $r"; else echo "  MISSING: $r"; fi
          done

          missing=$(comm -23 /tmp/wanted.txt /tmp/installed.txt)
          if [ -n "$missing" ]; then
            echo "::error title=Coverage check would fail::"
            printf '%s\n' "$missing" | sed 's/^/  - /'
            exit 1
          fi
          echo "::notice title=Coverage check passes::all $(wc -l < /tmp/wanted.txt) mirrors covered by $(wc -l < /tmp/installed.txt) installed repos"
