# @see https://github.com/ikselven/horde-satis.maintaina.com/blob/10030e3fbca81579dfd8ea2385d2291663b8bcbd/.github/workflows/horde-satis.yml
name: Satis Build
on:
  workflow_call:
  workflow_dispatch:
  repository_dispatch:
  push:
    branches:
      - master
  schedule:
    # Every 3h — picks up new upstream releases for packages declared in
    # `release-packages.json` (GitHub-released proprietary plugins that don't
    # have a Genero-owned fork driving satis via the VCS pattern), and re-reads
    # the tags of every `type: vcs` entry.
    #
    # This is also the safety net for the push-based path: plugin repos trigger
    # an immediate rebuild via `update.yml`, but that needs `PACKAGIST_UPDATE_PAT`
    # to be granted to the calling repo. When it isn't, `update.yml` warns and
    # exits green — the next scheduled build indexes the tag regardless. The
    # 04:30 slot still lands after the plugin update crons (nominally 04:05 UTC).
    - cron: '30 */3 * * *'
env:
  BUILD_DIR: build

concurrency:
  group: build
  cancel-in-progress: true

jobs:
  builder:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Create composer.json
        run: echo "{}" > composer.json

      - name: Get Date
        id: get-date
        run: echo "date=$(/bin/date -u "+%F")" >> $GITHUB_OUTPUT

      - name: Cache dependencies and build
        uses: actions/cache@v4
        with:
          path: |
            ~/.composer
            ${{ env.BUILD_DIR }}
          key: ${{ runner.os }}-php-${{ steps.get-date.outputs.date }}
          restore-keys: ${{ runner.os }}-php-

      - name: Synthesise GitHub-release package entries
        env:
          # GitHub-released closed-source plugins live under public repos —
          # GITHUB_TOKEN is enough; falls back to anonymous (60/h rate limit)
          # if absent, which is fine since we run at most once a day.
          GITHUB_TOKEN: ${{ secrets.GENEROI_DEPLOY_PAT || secrets.GITHUB_TOKEN }}
        run: node generate-release-packages.js satis.json satis.merged.json

      - name: Docker pull
        run: docker pull composer/satis

      - name: Docker build
        run: |
          export COMPOSER_HOME="$HOME/.composer"
          composer config -g github-oauth.github.com "${{ secrets.GENEROI_DEPLOY_PAT }}"
          docker run --rm --init \
            --user $(id -u):$(id -g) \
            --volume $(pwd):/build \
            --volume "${COMPOSER_HOME}:/composer" \
            composer/satis -vvv build /build/satis.merged.json /build/${{ env.BUILD_DIR }} --no-interaction

      - name: Rewrite dist URLs for release-based packages
        run: node rewrite-dist-urls.js ${{ env.BUILD_DIR }}

      - name: Publish to GitHub pages
        run: |
          rm composer.json satis.merged.json
          git checkout gh-pages
          # Wipe stale satis output so packages removed from satis.json (or
          # release-packages.json) actually disappear from the index. Composer
          # v2 metadata lives under p2/, v1 under include/.
          rm -rf include/* p2/*
          cp -R ${{ env.BUILD_DIR }}/* .
          rm -rf ${{ env.BUILD_DIR }}/
          git config --global user.name "${GITHUB_ACTOR}"
          git config --global user.email "${GITHUB_ACTOR}@users.noreply.github.com"
          git add -A
          git commit -m "Updated repository"
          git push
