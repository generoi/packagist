# @see https://github.com/ikselven/horde-satis.maintaina.com/blob/10030e3fbca81579dfd8ea2385d2291663b8bcbd/.github/workflows/horde-satis.yml
name: Satis Build
on:
  workflow_call:
  workflow_dispatch:
  repository_dispatch:
  push:
    branches:
      - master
  schedule:
    # Twice a day — picks up new upstream releases for packages declared in
    # `release-packages.json` (GitHub-released proprietary plugins that don't
    # have a Genero-owned fork driving satis via the VCS pattern), and re-reads
    # the tags of every `type: vcs` entry.
    #
    # This is a safety net, not the primary path. Plugin repos trigger an
    # immediate rebuild via `update.yml`, which needs `PACKAGIST_UPDATE_PAT` to
    # be granted to the calling repo; when it isn't, `update.yml` warns and exits
    # green, and the next scheduled build indexes the tag regardless.
    #
    # It ran every 3h, which is eight full rebuilds a day to catch the rare
    # release the dispatch path missed — and the dispatch path currently covers
    # every mirror in satis.json, with `release-packages.json` empty. A backstop
    # does not need to run more often than the thing it is backing up. Worst-case
    # latency for a mirror that loses its PAT grant goes from 3h to 12h; the
    # watchdog reports that grant gap on its own schedule anyway.
    #
    # The 04:30 slot still lands after the plugin update crons (nominally 04:05
    # UTC); 16:30 gives a second pass inside the working day.
    - cron: '30 4,16 * * *'
env:
  BUILD_DIR: build

concurrency:
  group: build
  cancel-in-progress: true

jobs:
  # GitHub auto-disables scheduled workflows in PUBLIC repos after 60 days with no
  # repository activity, and workflow runs do not count — only pushes do. This
  # repo is public and its `master` history is human-driven: observed gaps of 77,
  # 111 and 139 days. Publishing to `gh-pages` may or may not reset the timer
  # (undocumented, and this repo has not been idle long enough since the cron was
  # added on 2026-05-15 to find out), so do not rely on it.
  #
  # If the timer ever does expire, the scheduled rebuild stops and the watchdog
  # in watchdog.yml goes quiet with it — the exact silent failure both exist to
  # prevent. So keep the clock alive explicitly. This lives in *this* workflow
  # rather than watchdog.yml because this one runs twice a day: a push here resets
  # the repo-level clock and therefore protects both workflows.
  #
  # Same mechanism as generoi/github-action-update-plugins#15, which does this for
  # the plugin mirrors. Runs before the build so a failure here is visible without
  # blocking a rebuild.
  keepalive:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    # A checkout and, at most, one empty commit.
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0

      - name: Reset the inactivity timer if master has gone quiet
        env:
          THRESHOLD_DAYS: '45'
        run: |
          set -euo pipefail
          age=$(( ( $(date +%s) - $(git log -1 --format=%ct) ) / 86400 ))
          echo "master last changed ${age}d ago; threshold ${THRESHOLD_DAYS}d."
          if [ "$age" -lt "$THRESHOLD_DAYS" ]; then
            echo "Within threshold, nothing to do."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit --allow-empty -m "chore: keepalive

          No changes to master in ${age} days. Empty commit to reset GitHub's
          60-day inactivity timer, which would otherwise auto-disable the
          scheduled Satis Build and the watchdog in this public repository."
          git push origin HEAD:master
          echo "::notice title=Keepalive::Pushed an empty commit (master was ${age}d stale) to keep the scheduled workflows alive."

  builder:
    runs-on: ubuntu-latest
    # Without this the job inherits GitHub's 360-minute ceiling. The work is
    # ~70 sequential GitHub API traversals inside `composer/satis build`, any
    # one of which can stall rather than fail. ~3x the slowest healthy run.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Reads tags and composer.json from every `type: vcs` mirror in satis.json.
      #
      # Was GENEROI_DEPLOY_PAT, a personal access token on the generoi-deploy
      # machine user. Same reasoning as the app token in watchdog.yml: minted
      # per run, expires in an hour against a three-minute build, never needs
      # rotating, and scoped by what the app is installed on rather than by what
      # the machine user has been granted.
      #
      # `owner` rather than the default (this repo) so the minted token carries
      # the installation's full repository list. The client id is not a secret;
      # see the note in watchdog.yml for why it is inlined.
      - name: Mint a Composer token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          # genero-composer-bot, app id 4725940, installation 156728348
          client-id: Iv23liSq2pR9zC6lUtCH
          private-key: ${{ secrets.COMPOSER_BOT_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}

      # satis runs without --skip-errors below, so a mirror the token cannot
      # read already fails the build rather than dropping out of the index
      # quietly: Composer raises InvalidRepositoryException and satis rethrows
      # it. This check does not change that outcome, it improves the error. It
      # names every uncovered repository at once, before the container starts,
      # instead of failing on whichever one satis happened to reach first.
      #
      # Under an "all repositories" installation it compares against every repo
      # in the org and passes trivially, which is also correct.
      - name: Check the token covers every mirror in satis.json
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          set -euo pipefail

          gh api installation/repositories --paginate \
            --jq '.repositories[].full_name' | sort -u > /tmp/installed.txt

          jq -r '.repositories[] | select(.type=="vcs") | .url' satis.json \
            | sed -E 's#https://github.com/##; s#\.git$##' | sort -u > /tmp/wanted.txt

          missing=$(comm -23 /tmp/wanted.txt /tmp/installed.txt)
          if [ -n "$missing" ]; then
            echo "::error title=Mirror not covered::genero-composer-bot is not installed on the repositories listed below, so satis cannot read their tags and they would drop out of the index. Add them at https://github.com/organizations/generoi/settings/installations"
            printf '%s\n' "$missing" | sed 's/^/  - /'
            exit 1
          fi

          echo "All $(wc -l < /tmp/wanted.txt) mirrors covered by $(wc -l < /tmp/installed.txt) installed repositories."

      - name: Create composer.json
        run: echo "{}" > composer.json

      - name: Get Date
        id: get-date
        run: echo "date=$(/bin/date -u "+%F")" >> $GITHUB_OUTPUT

      - name: Cache dependencies and build
        uses: actions/cache@v4
        with:
          path: |
            ~/.composer
            ${{ env.BUILD_DIR }}
          key: ${{ runner.os }}-php-${{ steps.get-date.outputs.date }}
          restore-keys: ${{ runner.os }}-php-

      - name: Synthesise GitHub-release package entries
        env:
          # GitHub-released closed-source plugins live under public repos, so
          # the job's own GITHUB_TOKEN is enough — it is only here to lift the
          # anonymous 60/h rate limit. Deliberately not the app token: these are
          # upstream repos under other owners, which no installation of ours
          # covers.
          GITHUB_TOKEN: ${{ github.token }}
        run: node generate-release-packages.js satis.json satis.merged.json

      - name: Docker pull
        run: docker pull composer/satis

      - name: Docker build
        env:
          COMPOSER_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          export COMPOSER_HOME="$HOME/.composer"

          # Both entries, because this combination is the one verified end to
          # end. In practice http-basic shadows github-oauth for github.com —
          # Composer warns about the overlap and then sends even the API
          # request as Basic with the username `x-access-token`. That username
          # is what an installation token requires over git-over-HTTPS, where
          # github-oauth's `x-oauth-basic` is rejected outright
          # (composer/composer#11064), and api.github.com accepts it too. So
          # keep both rather than trimming to whichever reads tidier.
          #
          # They land in $COMPOSER_HOME/auth.json, mounted into the satis
          # container below.
          composer config -g github-oauth.github.com "$COMPOSER_TOKEN"
          composer config -g -a http-basic.github.com x-access-token "$COMPOSER_TOKEN"

          docker run --rm --init \
            --user $(id -u):$(id -g) \
            --volume $(pwd):/build \
            --volume "${COMPOSER_HOME}:/composer" \
            composer/satis -vvv build /build/satis.merged.json /build/${{ env.BUILD_DIR }} --no-interaction

          # auth.json sits inside the actions/cache path above, so leaving it
          # would upload a live credential into the cache tarball at the end of
          # the job. Nothing after this step reads it.
          rm -f "$COMPOSER_HOME/auth.json"

      - name: Rewrite dist URLs for release-based packages
        run: node rewrite-dist-urls.js ${{ env.BUILD_DIR }}

      # Runs before the branch switch below, while satis.merged.json and this
      # script are still in the worktree — `git checkout gh-pages` replaces
      # them. Reads the published index out of the ref rather than the working
      # tree for the same reason.
      - name: Refuse to publish a shorter index
        run: |
          set -euo pipefail
          rm -rf /tmp/previous-index && mkdir -p /tmp/previous-index
          if git rev-parse --verify -q origin/gh-pages >/dev/null \
            && git cat-file -e origin/gh-pages:p2 2>/dev/null; then
            git archive origin/gh-pages -- p2 | tar -x -C /tmp/previous-index
          fi
          node check-index-shrink.js \
            /tmp/previous-index/p2 \
            "${{ env.BUILD_DIR }}/p2" \
            satis.merged.json

      - name: Publish to GitHub pages
        run: |
          rm composer.json satis.merged.json
          git checkout gh-pages
          # Wipe stale satis output so packages removed from satis.json (or
          # release-packages.json) actually disappear from the index. Composer
          # v2 metadata lives under p2/, v1 under include/.
          rm -rf include/* p2/*
          cp -R ${{ env.BUILD_DIR }}/* .
          rm -rf ${{ env.BUILD_DIR }}/
          # Not GITHUB_ACTOR: on a scheduled or dispatched run that is whoever
          # last touched the workflow, so every "Updated repository" commit on
          # gh-pages was landing under a person's name. Same form as the
          # keepalive job above.
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A

          # satis stamps a "Last updated" time into index.html on every build, so
          # a rebuild that found nothing new still produced a commit — and every
          # commit here triggers a pages-build-deployment. That was the majority
          # of this repo's Actions usage: a run of the scheduled build that
          # changed nothing but a timestamp, and then a Pages deploy to publish
          # the new timestamp.
          #
          # A new or changed package always moves p2/, packages.json or include/,
          # so ignoring index.html is a sound test for "no package changed".
          #
          # It is NOT a sound test for "nothing changed", which is why `push` is
          # excluded: satis renders satis.json's `name` and `homepage` into the
          # page title and header, and those appear in no other output file. A
          # commit that edits only those would build a new index.html and nothing
          # else, and the check below would swallow it. A push to master is the
          # only way those reach the build, and there are a handful a month, so
          # publishing all of them unconditionally costs nothing.
          #
          # The badge now reads as the last time the index actually changed
          # rather than the last time a cron ran, which is the more useful of the
          # two. Run health is visible in the Actions tab either way.
          if [ "${{ github.event_name }}" != "push" ] \
            && git diff --cached --quiet -- . ':(exclude)index.html'; then
            echo "::notice title=No index change::No package changed — nothing to publish."
            exit 0
          fi

          git commit -m "Updated repository"
          git push
